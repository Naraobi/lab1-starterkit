            </div>
            <div class="mb-3">
              <label>Status</label>
              <select id="project-status" class="form-control">

  <!-- JS Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
 <script>
  let projects = [];

  // --- HELPER FUNCTION: Wrap description to 10 words per line ---
  // --- HELPER FUNCTION: Wrap description for display (table only) ---
// --- HELPER FUNCTION: Wrap description for table display ---
function wrapDescription(text, wordsPerLine = 10) {
  const words = text.split(' ');
  let result = '';
  for (let i = 0; i < words.length; i++) {
    result += words[i] + ' ';
    if ((i + 1) % wordsPerLine === 0) result += '<br>';
  }
  return result.trim();
}

// --- RENDER PROJECTS INTO TABLE ---
function renderProjects() {
  const tbody = document.querySelector('#project-table tbody');
  tbody.innerHTML = '';
  projects.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.title}</td>
      <td>${wrapDescription(p.description)}</td>
      <td>${p.startDate}</td>
      <td>${p.endDate}</td>
      <td>${p.status}</td>
      <td>
        <button class="btn btn-sm btn-warning me-1" onclick="editProject('${p.id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteProject('${p.id}')">Delete</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// --- RENDER PROJECTS INTO TABLE ---

  // --- FETCH PROJECTS FROM BACKEND ---
  async function fetchProjects() {
    const res = await fetch('http://localhost:5000/projects');
    projects = await res.json();
    renderProjects();
  }


  // --- ADD OR EDIT PROJECT ---
  document.getElementById('project-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const id = document.getElementById('project-id').value;
    const project = {
      title: document.getElementById('project-title').value,
      description: document.getElementById('project-description').value,
      startDate: document.getElementById('project-start').value,
      endDate: document.getElementById('project-end').value,
      status: document.getElementById('project-status').value
    };

    if (id) {
      await fetch(`http://localhost:5000/projects/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(project)
      });
    } else {
      await fetch('http://localhost:5000/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(project)
      });
    }

    document.getElementById('project-form').reset();
    bootstrap.Modal.getInstance(document.getElementById('projectModal')).hide();
    fetchProjects();
  });

  // --- DELETE PROJECT ---
  async function deleteProject(id) {
    if (confirm('Are you sure you want to delete this project?')) {
      await fetch(`http://localhost:5000/projects/${id}`, { method: 'DELETE' });
      fetchProjects();
    }
  }

  // --- EDIT PROJECT ---
  function editProject(id) {
    const project = projects.find(p => p.id === id);
    if (!project) return;
    document.getElementById('project-id').value = project.id;
    document.getElementById('project-title').value = project.title;
    document.getElementById('project-description').value = project.description;
    document.getElementById('project-start').value = project.startDate;
    document.getElementById('project-end').value = project.endDate;
    document.getElementById('project-status').value = project.status;
    new bootstrap.Modal(document.getElementById('projectModal')).show();
  }

  // --- INITIAL FETCH ---
  fetchProjects();
</script>
